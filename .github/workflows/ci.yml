name: Fleet draft validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  syntax:
    name: Repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ANSIBLE_COLLECTIONS_PATH: .work/collections
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: ansible-galaxy collection install -r requirements.yml -p .work/collections
      - run: python -m pytest -q -p no:cacheprovider
      - run: python scripts/fleet_catalog.py --catalog examples/fleet-catalog.json --out "$RUNNER_TEMP/fleet-inventory"
      - run: python scripts/check-inventory --skip-secrets --catalog examples/fleet-catalog.json --inventory "$RUNNER_TEMP/fleet-inventory"
      - name: Check every playbook without contacting hosts
        shell: bash
        run: |
          set -euo pipefail
          for playbook in playbooks/*.yml; do
            ansible-playbook -i localhost, --syntax-check "$playbook"
          done
