---
- name: Minimal bootstrap for a newly installed Pi
  hosts: "{{ target_host | default('none') }}"
  gather_facts: true
  become: true
  pre_tasks:
    - name: Restrict bootstrap to declared Raspberry Pis
      ansible.builtin.assert:
        that:
          - inventory_hostname in groups['raspberry_pis']
          - ansible_architecture in ['aarch64', 'arm64']
        quiet: true
  tasks:
    - name: Install only fleet prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - nfs-common
          - python3
          - python3-apt
          - python3-venv
        state: present
        update_cache: true
