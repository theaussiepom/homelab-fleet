---
- name: Reload observer systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Conditionally restart probe agent
  ansible.builtin.systemd_service:
    name: homelab-probe-agent.service
    state: restarted
  when: homelab_allow_service_restart | bool

- name: Conditionally restart observer gateway
  ansible.builtin.systemd_service:
    name: homelab-observer-gateway.service
    state: restarted
  when:
    - homelab_allow_service_restart | bool
    - inventory_hostname in groups['observer_gateway']
