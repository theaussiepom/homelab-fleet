---
# Every write/start gate is OFF. No credentials are generated or copied by this role.
zabbix_agent_enabled: false
zabbix_agent_install_enabled: false
zabbix_agent_deploy_enabled: false
zabbix_agent_canonical_integrated: false
zabbix_agent_version_change_approved: false
zabbix_agent_maintenance_window_approved: false
zabbix_agent_runtime_baseline_confirmed: false
zabbix_agent_transport_ready: false
zabbix_agent_version_compatibility_reviewed: false
zabbix_agent_secret_boundary_verified: false
zabbix_agent_central_identity_confirmed: false
zabbix_agent_overlay_attachment_approved: false
# Per-run manager evidence for lazy-overlay host's first attachment; never creates an overlay.
zabbix_agent_overlay_absence_manager_verified: false
# Shared fleet gate retains its established cross-role name.
homelab_allow_service_restart: false  # noqa: var-naming[no-role-prefix]

zabbix_agent_existing_project: "{{ inventory_hostname == zabbix_agent_controller_host }}"
zabbix_agent_project_name: ""
zabbix_agent_compose_dir: ""
zabbix_agent_service_name: >-
  {{ 'zabbix-agent' if inventory_hostname == zabbix_agent_controller_host
     else 'zabbix-agent-' ~ (inventory_hostname | lower) }}
zabbix_agent_container_name: "{{ zabbix_agent_service_name }}"
zabbix_agent_overlay_network: underground
zabbix_agent_overlay_network_id: ""
zabbix_agent_swarm_node_id: ""
zabbix_agent_canonical_compose: /mnt/nas/docker/homelab/stacks/benbeast/monitoring/compose.yaml
# Expected SHA-256 AFTER the separately approved canonical patch, never the pre-patch source.
# This role does not patch the canonical file or create a controller host override.
zabbix_agent_canonical_sha256: ""
zabbix_agent_expected_container_id: ""
# Desired local image identity; runtime baseline below is separate during approved version changes.
zabbix_agent_expected_image_id: ""
zabbix_agent_expected_container_image_id: >-
  {{ 'sha256:faae8fdfb48382b7ab0c93d1d07ac45465f2c13bf0b691ff08b4717e16eedc5b'
     if inventory_hostname == zabbix_agent_controller_host else zabbix_agent_expected_image_id }}
# Pis require a repository digest. controller host retains its current local image ID by default.
# Any explicitly approved interim version change requires the exact reviewed digest below.
zabbix_agent_image: ""
zabbix_agent_image_digest: ""
zabbix_agent_runtime_uid: null
zabbix_agent_runtime_gid: null
zabbix_agent_verified_image_user: ""
zabbix_agent_image_user_verified: false
zabbix_agent_architecture: "{{ 'amd64' if inventory_hostname == zabbix_agent_controller_host else 'arm64' }}"
zabbix_agent_hostname: "{{ 'zabbix-server' if inventory_hostname == zabbix_agent_controller_host else inventory_hostname }}"
zabbix_agent_server_active: ""
# Unencrypted is an explicit Pi-only alternative; existing controller host behavior stays PSK.
zabbix_agent_transport_mode: psk
# Preserve controller host's existing passive peer, but give new Pi agents active checks only.
zabbix_agent_passive_server: "{{ 'zabbix-server' if inventory_hostname == zabbix_agent_controller_host else '' }}"
zabbix_agent_passive_tls_accept: >-
  {{ 'unencrypted' if inventory_hostname == zabbix_agent_controller_host else zabbix_agent_transport_mode }}
zabbix_agent_psk_identity: ""
zabbix_agent_psk_file: ""
zabbix_agent_psk_container_file: /run/zabbix-secrets/agent.psk
# Optional pre-existing EMPTY REGULAR FILE filesystem anchors; the role never creates these.
# Each item: alias (root/nfs_docker/nfs_dev), source, expected_mount, expected_fstype.
zabbix_agent_filesystem_anchors: []
zabbix_agent_docker_binary: /usr/bin/docker
zabbix_agent_findmnt_binary: /usr/bin/findmnt

# Supplied by the reviewed private catalog; an empty contract cannot admit a host.
zabbix_agent_admitted_hosts: []
zabbix_agent_controller_host: ""
zabbix_agent_lazy_overlay_host: ""
zabbix_agent_root_anchor_approved: false
zabbix_agent_admitted_overlay_network_id: ""
